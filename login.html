<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgenticArmor — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#020c14;--bg2:#041828;--bg3:#061e30;--panel:#071f2e;
    --border:#0d3a52;--border2:#0f4a68;--accent:#00d4ff;
    --safe:#00ff6a;--safe-dim:#00cc55;--safe-bg:rgba(0,255,106,0.10);--safe-border:rgba(0,255,106,0.30);
    --danger:#ff2244;--danger-dim:#cc1133;--danger-bg:rgba(255,34,68,0.12);--danger-border:rgba(255,34,68,0.40);
    --warn:#ffbb00;
    --text:#c8e8f5;--text2:#6ea8c8;--text3:#2d6a8a;
    --mono:'Share Tech Mono',monospace;--head:'Orbitron',sans-serif;--body:'Rajdhani',sans-serif;
  }

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  html,body{
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:var(--body);
    overflow:hidden;
  }

  /* scanline overlay */
  body::before{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;
    background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px)
  }
  /* grid overlay */
  body::after{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:linear-gradient(rgba(0,212,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.02) 1px,transparent 1px);
    background-size:40px 40px
  }

  /* ── HEADER (identical to dashboard) ── */
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:0 24px;height:60px;
    background:linear-gradient(90deg,#020c14 0%,#041828 50%,#020c14 100%);
    border-bottom:1px solid var(--border2);
    position:fixed;top:0;left:0;right:0;z-index:100;
  }
  .logo{display:flex;align-items:center;gap:12px}
  .logo-icon{
    width:36px;height:36px;border:2px solid var(--accent);
    display:flex;align-items:center;justify-content:center;
    clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
    background:rgba(0,212,255,0.1);animation:pulse-border 2s ease-in-out infinite
  }
  @keyframes pulse-border{
    0%,100%{box-shadow:0 0 0 0 rgba(0,212,255,0.4)}
    50%{box-shadow:0 0 0 8px rgba(0,212,255,0)}
  }
  .logo-text{font-family:var(--head);font-size:18px;font-weight:900;letter-spacing:3px;color:var(--accent)}
  .logo-sub{font-size:11px;color:var(--text3);letter-spacing:2px;font-family:var(--mono)}
  .header-right{font-family:var(--mono);font-size:12px;color:var(--text3);letter-spacing:1px}

  /* ── PAGE LAYOUT ── */
  .page{
    position:relative;z-index:1;
    display:flex;align-items:center;justify-content:center;
    height:100vh;padding-top:60px;
  }

  /* ── LOGIN CARD ── */
  .login-card{
    width:420px;
    background:var(--bg2);
    border:1px solid var(--border2);
    border-radius:4px;
    overflow:hidden;
    animation:cardIn 0.4s ease;
  }
  @keyframes cardIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

  .card-header{
    padding:24px 28px 20px;
    border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:14px;
  }
  .card-icon{
    width:42px;height:42px;
    border:1px solid var(--accent);
    display:flex;align-items:center;justify-content:center;
    clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
    background:rgba(0,212,255,0.08);flex-shrink:0;
  }
  .card-title{font-family:var(--head);font-size:16px;font-weight:900;letter-spacing:2px;color:var(--accent)}
  .card-sub{font-family:var(--mono);font-size:11px;color:var(--text3);letter-spacing:1px;margin-top:3px}

  .card-body{padding:28px;}

  /* ── FIELD ── */
  .field{margin-bottom:18px}
  .field label{
    display:block;
    font-family:var(--mono);font-size:11px;letter-spacing:2px;
    color:var(--text3);text-transform:uppercase;margin-bottom:7px;
  }
  .field input{
    width:100%;
    background:var(--panel);
    border:1px solid var(--border2);
    border-radius:3px;
    color:var(--text);
    font-family:var(--mono);font-size:13px;
    padding:10px 12px;
    outline:none;
    transition:border-color 0.2s, box-shadow 0.2s;
    letter-spacing:1px;
  }
  .field input::placeholder{color:var(--text3)}
  .field input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 2px rgba(0,212,255,0.12);
  }

  /* ── LOGIN BUTTON ── */
  .btn-login{
    width:100%;
    padding:12px;
    margin-top:6px;
    background:rgba(0,212,255,0.1);
    border:1px solid var(--accent);
    border-radius:3px;
    color:var(--accent);
    font-family:var(--mono);font-size:14px;font-weight:700;
    letter-spacing:3px;text-transform:uppercase;
    cursor:pointer;
    transition:background 0.2s, box-shadow 0.2s;
  }
  .btn-login:hover{
    background:rgba(0,212,255,0.2);
    box-shadow:0 0 16px rgba(0,212,255,0.15);
  }
  .btn-login:active{transform:scale(0.99)}
  .btn-login:disabled{opacity:0.5;cursor:not-allowed}

  /* ── MESSAGE ── */
  .msg{
    margin-top:16px;
    padding:10px 12px;
    border-radius:3px;
    font-family:var(--mono);font-size:12px;
    letter-spacing:1px;
    display:none;
    border:1px solid;
  }
  .msg.success{color:var(--safe);border-color:var(--safe-border);background:var(--safe-bg)}
  .msg.error{color:var(--danger);border-color:var(--danger-border);background:var(--danger-bg)}

  /* ── DIVIDER ── */
  .card-footer{
    padding:14px 28px;
    border-top:1px solid var(--border);
    display:flex;align-items:center;gap:8px;
    font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:1px;
  }
  .footer-dot{width:6px;height:6px;border-radius:50%;background:var(--safe);
    box-shadow:0 0 6px var(--safe);animation:blink 1.5s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}

  /* ── SPINNER ── */
  .spinner{
    display:inline-block;width:14px;height:14px;
    border:2px solid rgba(0,212,255,0.2);
    border-top-color:var(--accent);
    border-radius:50%;
    animation:spin 0.7s linear infinite;
    margin-right:8px;vertical-align:middle;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- Header identical to dashboard -->
<header>
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#00d4ff" stroke-width="2" width="18" height="18">
        <path d="M12 2L2 7v5c0 5.55 3.84 10.74 10 12 6.16-1.26 10-6.45 10-12V7L12 2z"/>
        <path d="M9 12l2 2 4-4"/>
      </svg>
    </div>
    <div>
      <div class="logo-text">AGENTICARMOR</div>
      <div class="logo-sub">LIVE SOC OPERATIONS — REAL ML BACKEND</div>
    </div>
  </div>
  <div class="header-right">SECURE ACCESS PORTAL</div>
</header>

<div class="page">
  <div class="login-card">

    <div class="card-header">
      <div class="card-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#00d4ff" stroke-width="2" width="20" height="20">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <div>
        <div class="card-title">OPERATOR LOGIN</div>
        <div class="card-sub">AUTHENTICATE TO ACCESS SOC DASHBOARD</div>
      </div>
    </div>

    <div class="card-body">
      <div class="field">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="operator@agenticarmor.io" autocomplete="email"/>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••••••" autocomplete="current-password"
               onkeydown="if(event.key==='Enter') login()"/>
      </div>

      <button class="btn-login" id="login-btn" onclick="login()">
        ▶ &nbsp; AUTHENTICATE
      </button>

      <div class="msg" id="msg"></div>
    </div>

    <div class="card-footer">
      <div class="footer-dot"></div>
      PROTECTED BY FIREBASE AUTH · AGENTICARMOR v2.0
    </div>

  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyB6xXbC5jyRJ5H_-YOQZFMmwrtWcCHdF3w",
  authDomain: "agenticarmor-e3d1f.firebaseapp.com",
  projectId: "agenticarmor-e3d1f",
  storageBucket: "agenticarmor-e3d1f.firebasestorage.app",
  messagingSenderId: "187028891250",
  appId: "1:187028891250:web:1effd7c81fd681a24884eb",
  measurementId: "G-GVQ77KNE1K"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.login = function () {
  const email    = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const btn      = document.getElementById("login-btn");
  const msg      = document.getElementById("msg");

  if(!email || !password){
    showMsg("Please enter your email and password.", "error");
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> AUTHENTICATING...';
  msg.style.display = "none";

  signInWithEmailAndPassword(auth, email, password)
    .then(() => {
      showMsg("✓ Authentication successful — redirecting...", "success");
      setTimeout(() => { window.location.href = "dashboard_live.html"; }, 900);
    })
    .catch((error) => {
      btn.disabled = false;
      btn.innerHTML = "▶ &nbsp; AUTHENTICATE";
      const friendly = error.code === "auth/invalid-credential" || error.code === "auth/wrong-password"
        ? "Invalid credentials. Check your email and password."
        : error.code === "auth/too-many-requests"
        ? "Too many attempts. Please wait and try again."
        : error.message;
      showMsg("⚠ " + friendly, "error");
    });
};

function showMsg(text, type){
  const msg = document.getElementById("msg");
  msg.textContent = text;
  msg.className = "msg " + type;
  msg.style.display = "block";
}
</script>

</body>
</html>
